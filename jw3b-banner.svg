<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="~❯ JW3B._ — John Wellard, Senior Agentic AI Developer and Smart-Contract Auditor">
  <!-- Brand asset. Copyright (c) 2026 John Wellard (jw3b.dev). All rights reserved. See LICENSE-BRAND.md. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t { opacity: 0; }
    </style>
  </defs>
  <rect width="960" height="200" fill="#020617"/>
  <rect width="960" height="200" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="199" fill="none" stroke="#1e293b"/>
  <!-- title bar -->
  <rect x="0" y="0" width="960" height="28" fill="#020617" fill-opacity="0.7"/>
  <line x1="0" y1="28.5" x2="960" y2="28.5" stroke="#1e293b"/>
  <circle cx="18" cy="14" r="5" fill="#f43f5e" fill-opacity="0.8"/>
  <circle cx="34" cy="14" r="5" fill="#fbbf24" fill-opacity="0.8"/>
  <circle cx="50" cy="14" r="5" fill="#34d399" fill-opacity="0.8"/>
  <text x="66" y="18" class="mono" font-size="11" fill="#64748b">jw3b@agilegypsy-labs: ~</text>
  <text x="944" y="18" class="mono" font-size="11" fill="#64748b" text-anchor="end">ENV: PRODUCTION</text>

  <!-- the mark: ~❯ JW3B._  (types in, cursor blinks) -->
  <g class="mono" font-size="72" font-weight="600" filter="url(#glow)">
    <text x="40" y="118" fill="#34d399">~❯</text>
    <text x="150" y="118" fill="#f1f5f9" class="t">J<animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.01s" fill="freeze"/></text>
    <text x="194" y="118" fill="#f1f5f9" class="t">W<animate attributeName="opacity" from="0" to="1" begin="0.64s" dur="0.01s" fill="freeze"/></text>
    <text x="238" y="118" fill="#22d3ee" class="t">3<animate attributeName="opacity" from="0" to="1" begin="0.78s" dur="0.01s" fill="freeze"/></text>
    <text x="282" y="118" fill="#f1f5f9" class="t">B<animate attributeName="opacity" from="0" to="1" begin="0.92s" dur="0.01s" fill="freeze"/></text>
    <text x="326" y="118" fill="#22d3ee" class="t">.<animate attributeName="opacity" from="0" to="1" begin="1.06s" dur="0.01s" fill="freeze"/></text>
    <text x="370" y="118" fill="#34d399">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></text>
  </g>

  <!-- subtitle lines -->
  <g class="mono" font-size="14">
    <text x="42" y="152" fill="#64748b" opacity="0"><tspan fill="#34d399">~❯</tspan> cat about.md<animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.01s" fill="freeze"/></text>
    <text x="42" y="176" fill="#f1f5f9" font-weight="600" opacity="0">John Wellard <tspan fill="#22d3ee">//</tspan> Senior Agentic AI Developer &amp; Smart-Contract Auditor<animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.01s" fill="freeze"/></text>
  </g>

  <!-- right column: status -->
  <g class="mono" font-size="11" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.01s" fill="freeze"/>
    <text x="600" y="60" fill="#64748b">// status · synced with jw3b.dev</text>
    <text x="600" y="82" fill="#94a3b8">codehawks</text><text x="944" y="82" fill="#34d399" text-anchor="end">#124 · 17 findings · 8 High · 1,430 EXP</text>
    <text x="600" y="102" fill="#94a3b8">labs</text><text x="944" y="102" fill="#cbd5e1" text-anchor="end">AgileGypsy Labs · UK</text>
    <text x="600" y="122" fill="#94a3b8">stack</text><text x="944" y="122" fill="#cbd5e1" text-anchor="end">Claude · React 19 · Workers · Foundry · Base</text>
    <text x="600" y="142" fill="#94a3b8">live</text><text x="944" y="142" fill="#cbd5e1" text-anchor="end">/audit · /ctf · /work · concierge</text>
  </g>
  <text x="944" y="176" class="mono" font-size="13" fill="#94a3b8" text-anchor="end">// STAY WEIRD 👽</text>
</svg>
